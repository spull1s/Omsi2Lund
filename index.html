<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LundaÅr: OMSI 2 Devlogg</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --text: #e0e0e0;
            --accent: #22c55e; /* Skånetrafiken-grön */
            --border: #333;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            max-width: 640px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.6;
        }
        header {
            text-align: center;
            margin: 40px 0;
        }
        header h1 {
            margin: 0;
            font-size: 2rem;
            letter-spacing: -0.05em;
        }
        header p {
            color: #888;
            font-size: 1rem;
        }
        #feed {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .post {
            background: var(--surface);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            transition: transform 0.2s ease;
        }
        .post:hover {
            transform: translateY(-2px);
        }
        .post-date {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 12px;
            display: block;
        }
        .post-content {
            font-size: 1.05rem;
            white-space: pre-wrap; /* Bevarar radbrytningar från Discord */
        }
        .post-media img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 16px;
            border: 1px solid var(--border);
        }
        .loading {
            text-align: center;
            color: #888;
        }
        .post-content a { 
    color: var(--accent); 
    text-decoration: none; 
        }
        .post-content a:hover { 
    text-decoration: underline; 
        }
    </style>
</head>
<body>

    <header>
        <h1>🚌 LundaÅr</h1>
        <p>Realtidsuppdateringar från OMSI 2-bygget</p>
    </header>

    <main id="feed">
        <div class="loading">Laddar senaste uppdateringarna från Discord... ⏳</div>
    </main>

    <script>
        // Byt ut mot din API/RSS-länk när backenden är uppe
        const FEED_URL = 'https://omsidevloggapi.ts2tools.workers.dev'; 
        
        async function loadFeed() {
            const feedContainer = document.getElementById('feed');
            
            try {
                // Här väntar vi oss JSON, men strukturen kan anpassas beroende på backend
                const response = await fetch(FEED_URL);
                if (!response.ok) throw new Error('Nätverksfel');
                const posts = await response.json(); 
                
                feedContainer.innerHTML = ''; // Rensa loading-texten

                posts.forEach(post => {
                    const postEl = document.createElement('article');
                    postEl.className = 'post';
                    
                    // Formatera datumet snyggt
                    const date = new Date(post.timestamp).toLocaleDateString('sv-SE', {
                        year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
                    });

                    // Bygg upp HTML för inlägget
                    let html = `<span class="post-date">${date}</span>`;
                    html += `<div class="post-content">${marked.parse(post.content)}</div>`;
                    
                    // Om det finns en bifogad bild/skärmdump från Discord
                    if (post.image_url) {
                        html += `<div class="post-media"><img src="${post.image_url}" alt="Screenshot"></div>`;
                    }
                    
                    postEl.innerHTML = html;
                    feedContainer.appendChild(postEl);
                });

            } catch (error) {
                console.error(error);
                feedContainer.innerHTML = '<div class="loading">Kunde inte ladda flödet just nu. 🚨</div>';
            }
        }

         loadFeed(); // Avkommentera när du har URL:en
    </script>
</body>
</html>
